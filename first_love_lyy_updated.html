<!DOCTYPE html>
<html lang="my"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffe6ef"><title>First love lyy 💗</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;overflow:hidden;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#ffe0eb,#fff4f7 55%,#ffd6e5);color:#71384d}.card{width:min(100%,440px);background:rgba(255,255,255,.94);border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 18px 55px #ae49702e;position:relative;z-index:2}.cat{font-size:66px}h1{font-size:clamp(23px,6vw,30px);margin:8px 0 12px}p{line-height:1.8;margin:0 auto 20px;font-size:16px}.stage{min-height:170px;position:relative;display:flex;align-items:center;justify-content:center;gap:14px;padding:18px 6px;overflow:visible}button{border:0;border-radius:999px;padding:14px 24px;font-size:17px;font-weight:800;cursor:pointer;transition:transform .35s ease,font-size .35s ease,padding .35s ease,box-shadow .35s ease;touch-action:manipulation}#yes{background:#ff5d93;color:white;position:relative;z-index:3;box-shadow:0 8px 20px #ff5d9347;transform-origin:center}#no{background:#f3edf0;color:#795767;position:relative;z-index:4}.hint{font-size:13px;color:#a47b8b;margin-top:8px}#result{display:none;margin-top:18px;padding:18px 14px;background:#fff0f5;border-radius:18px;line-height:1.8;animation:pop .5s ease both}.heart{position:fixed;bottom:-30px;z-index:1;pointer-events:none;animation:floatUp 4s linear forwards}@keyframes floatUp{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}@media(max-width:360px){.card{padding:25px 16px}.stage{gap:9px}button{padding:12px 19px}}
</style></head><body>
<main class="card"><div class="cat">🐱💗</div><h1 id="heading">ငါ့ကို နောက်တစ်ခေါက် အခွင့်အရေးပေးမလား? 🥺</h1>
<p id="message">အရင်က အမှားတွေအတွက် တကယ်တောင်းပန်ပါတယ်။ မင်းစိတ်အဆင်သင့်ဖြစ်တဲ့အချိန်မှာပဲ ပြန်စဉ်းစားပေးပါနော်။</p>
<section class="stage" id="stage"><button id="yes" type="button">Yes 💖</button><button id="no" type="button">No 🤍</button></section>
<div class="hint" id="hint">No ကိုနှိပ်ကြည့်လို့ရတယ်နော် 🙈</div><div id="result" aria-live="polite"></div>
<p class="hint" style="margin-top:16px">ဒီစာမျက်နှာက အပျော်သဘောလေးပါ။ တကယ့်ဆုံးဖြတ်ချက်ကိုတော့ မင်းရဲ့ခံစားချက်အတိုင်း လေးစားပါတယ်။</p></main>
<script>
(()=>{const yes=document.getElementById('yes'),no=document.getElementById('no'),heading=document.getElementById('heading'),message=document.getElementById('message'),hint=document.getElementById('hint'),result=document.getElementById('result');let count=0,finished=false;
const lines=['ဟယ်… ထပ်စဉ်းစားပေးပါဦး 🥺','Yes လေးက ပိုကြီးလာပြီနော် 🙈','တကယ်တောင်းပန်ပါတယ် 💗','နောက်တစ်ခေါက် အခွင့်အရေးလေး…','နောက်ဆုံးတစ်ခါလောက် စဉ်းစားပေးပါနော် 🥹'];
function heart(){const e=document.createElement('span');e.className='heart';e.textContent=['💗','💖','💕','💘'][Math.floor(Math.random()*4)];e.style.left=(Math.random()*100)+'vw';e.style.fontSize=(18+Math.random()*22)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}
function finish(){if(finished)return;finished=true;no.hidden=true;yes.style.transform='scale(1)';yes.style.fontSize='20px';yes.style.padding='18px 34px';heading.textContent='ကျေးဇူးတင်ပါတယ် 💗';message.textContent='မင်းရဲ့အဖြေကို လေးစားပါတယ်။ ပြန်စဖို့ အခွင့်အရေးရခဲ့ရင် ဒီတစ်ခါ ပိုဂရုစိုက်ပြီး နားလည်ပေးပါ့မယ်။';hint.style.display='none';result.style.display='block';result.innerHTML='💌 <strong>Thank you for hearing me out.</strong><br>အလျင်မလိုပါဘူးနော်။ မင်းအဆင်ပြေတဲ့အချိန်မှပဲ ဆက်ပြောကြမယ်။';for(let i=0;i<18;i++)setTimeout(heart,i*100)}
no.addEventListener('click',()=>{if(finished)return;count++;const scale=Math.min(1+count*.24,2.25);yes.style.transform='scale('+scale+')';yes.style.fontSize=(17+Math.min(count*1.2,10))+'px';yes.style.padding=(14+Math.min(count*1.4,13))+'px '+(24+Math.min(count*2.2,22))+'px';heading.textContent=lines[Math.min(count-1,lines.length-1)];if(count>=6)setTimeout(finish,450)});
yes.addEventListener('click',()=>{if(!finished)finish()});
})();
</script></body></html>
